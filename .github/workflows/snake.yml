name: Generate contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#b9705a&color_dots=#ece7df,#d3dfca,#adc5a1,#86a679,#5f8054
            dist/snake-dark.svg?palette=github-dark&color_snake=#d9b26f&color_dots=#2d2a26,#43523f,#5f7a55,#82a275,#a9c69b

      - name: Push the snake to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
