<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120" role="img" aria-label="Animated waves">
<title>Animated waves</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient><clipPath id="f"><rect width="860" height="120" rx="0"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  .fade-in{animation:fadeIn .8s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .w1{animation:flow 9s linear infinite}
  .w2{animation:flow 13s linear infinite reverse}
  .w3{animation:flow 17s linear infinite}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-430px)}}
</style>

<g clip-path="url(#f)">
  <path class="w3" d="M0 54 Q53.75 40 107.5 54 T215 54 Q268.75 40 322.5 54 T430 54 Q483.75 40 537.5 54 T645 54 Q698.75 40 752.5 54 T860 54 Q913.75 40 967.5 54 T1075 54 Q1128.75 40 1182.5 54 T1290 54 Q1343.75 40 1397.5 54 T1505 54 Q1558.75 40 1612.5 54 T1720 54 Q1773.75 40 1827.5 54 T1935 54 V120 H0 Z" fill="#f472b6" opacity=".18"/>
  <path class="w2" d="M0 66 Q71.675 50 143.35 66 T286.7 66 Q358.375 50 430.04999999999995 66 T573.4 66 Q645.0749999999999 50 716.75 66 T860.0999999999999 66 Q931.7749999999999 50 1003.4499999999999 66 T1146.8 66 Q1218.475 50 1290.1499999999999 66 T1433.5 66 Q1505.175 50 1576.85 66 T1720.2 66 V120 H0 Z" fill="#a78bfa" opacity=".28"/>
  <path class="w1" d="M0 80 Q53.75 68 107.5 80 T215 80 Q268.75 68 322.5 80 T430 80 Q483.75 68 537.5 80 T645 80 Q698.75 68 752.5 80 T860 80 Q913.75 68 967.5 80 T1075 80 Q1128.75 68 1182.5 80 T1290 80 Q1343.75 68 1397.5 80 T1505 80 Q1558.75 68 1612.5 80 T1720 80 Q1773.75 68 1827.5 80 T1935 80 V120 H0 Z" fill="url(#accent)" opacity=".55"/>
</g>
</svg>
