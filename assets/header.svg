  .fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  .fade-in{animation:fadeIn .8s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .blob{filter:url(#blur)}
  .b1{animation:drift1 14s ease-in-out infinite alternate}
  .b2{animation:drift2 17s ease-in-out infinite alternate}
  .b3{animation:drift3 20s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(90px,40px)}}
  @keyframes drift2{to{transform:translate(-110px,-30px)}}
  @keyframes drift3{to{transform:translate(-60px,50px)}}
  .halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
  .net{animation:fadeIn 1.2s .3s ease both}
  .cursor{animation:blink 1s step-end infinite}
</style>

