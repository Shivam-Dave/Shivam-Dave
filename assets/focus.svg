        <line x1="4" x2="62" y1="6" y2="6" stroke="#f472b6" stroke-width="2" class="scan"/>
      </g>
  <text class="sans" x="25" y="132" font-size="21" font-weight="700" fill="#e6edf3">Computer Vision</text>
  <text class="sans" x="25" y="168" font-size="15.5" fill="#8b949e"><tspan fill="#22d3ee">›</tspan> licence plate recognition (ANPR)</text>
  <text class="sans" x="25" y="195" font-size="15.5" fill="#8b949e"><tspan fill="#22d3ee">›</tspan> detection + OCR pipelines</text>
  <text class="sans" x="25" y="222" font-size="15.5" fill="#8b949e"><tspan fill="#22d3ee">›</tspan> model fine-tuning &amp; evaluation</text>
</g>
