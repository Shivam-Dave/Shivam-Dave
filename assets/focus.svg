  <text class="sans" x="320" y="168" font-size="15.5" fill="#8b949e"><tspan fill="#22d3ee">›</tspan> multi-tenant REST APIs</text>
  <text class="sans" x="320" y="195" font-size="15.5" fill="#8b949e"><tspan fill="#22d3ee">›</tspan> auth with JWT &amp; bcrypt</text>
  <text class="sans" x="320" y="222" font-size="15.5" fill="#8b949e"><tspan fill="#22d3ee">›</tspan> Node.js · Express · MySQL</text>
</g>
