<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" aria-label="What I work on: computer vision (ANPR, detection and OCR, fine-tuning), backend systems (multi-tenant REST APIs, JWT auth, Node.js, Express, MySQL), ML and NLP (classical ML, deep learning, seq2seq summarisation)">
<title>What I work on: computer vision (ANPR, detection and OCR, fine-tuning), backend systems (multi-tenant REST APIs, JWT auth, Node.js, Express, MySQL), ML and NLP (classical ML, deep learning, seq2seq summarisation)</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  .fade-in{animation:fadeIn .8s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .card{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  .scan{animation:scan 2.6s ease-in-out infinite alternate}
  @keyframes scan{to{transform:translateY(40px)}}
  .led{animation:blink 1.2s step-end infinite}
  .node{transform-box:fill-box;transform-origin:center;animation:node 2.4s ease-in-out infinite}
  @keyframes node{50%{transform:scale(1.35)}}
</style>
<g class="card" style="animation-delay:0.00s">
  <rect x="1" y="1" width="270" height="260" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="23" y="1" width="56" height="3" rx="1.5" fill="url(#accent)"/>
  <g transform="translate(25,32)" fill="none" stroke-width="3" stroke-linecap="round">
        <path d="M0 14V0H14M52 0H66V14M66 38V52H52M14 52H0V38" stroke="#22d3ee"/>
        <rect x="12" y="17" width="42" height="18" rx="3" stroke="#a78bfa" stroke-width="2"/>
