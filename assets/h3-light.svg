<svg xmlns="http://www.w3.org/2000/svg" width="860" height="58" viewBox="0 0 860 58" role="img" aria-label="Tech Stack">
<title>Tech Stack</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#93b38c"/><stop offset=".5" stop-color="#d9b26f"/><stop offset="1" stop-color="#cf8a6b"/>
  </linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  .fade-in{animation:fadeIn .8s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    .t{animation:slide .7s cubic-bezier(.2,.7,.2,1) both}
    @keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
    .bar{animation:grow 1.1s .2s cubic-bezier(.6,0,.2,1) both;transform-box:fill-box;transform-origin:left}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .spark{animation:run 3.6s 1.3s ease-in-out infinite}
    @keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(680px);opacity:0}}
</style>

<g class="t">
  <text class="mono" x="0" y="34" font-size="16" fill="url(#accent)" font-weight="700">03</text>
  <text class="mono" x="30" y="34" font-size="16" fill="#6f685e">//</text>
  <text class="sans" x="56" y="35" font-size="24" font-weight="700" fill="#2b2824">Tech Stack</text>
</g>
<rect x="0" y="50" width="860" height="1.5" fill="#e0d8cc"/>
<rect class="bar" x="0" y="49" width="170" height="3.5" rx="1.75" fill="url(#accent)"/>
<circle class="spark" cx="170" cy="50.7" r="2.4" fill="#d9b26f"/>
</svg>
